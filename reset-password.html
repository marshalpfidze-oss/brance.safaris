<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <meta name="description" content="Reset your Brance Tours & Safaris account password.">
  <meta name="robots" content="noindex, nofollow">
  <meta name="referrer" content="no-referrer">
  <title>Password Help | Brance Tours & Safaris</title>
  <link rel="stylesheet" href="sytle.css">
  <script src="customer.js" defer></script>
</head>
<body class="account-page">
  <header class="account-header">
    <a class="brand" href="/" aria-label="Brance Tours & Safaris home">
      <img src="logo.png" alt="" class="brand-logo" width="1254" height="1254">
      <span class="brand-name">BRANCE TOURS & SAFARIS</span>
    </a>
    <nav class="account-nav" aria-label="Account navigation">
      <a href="/">Home</a>
      <a class="nav-auth" id="loginNav" href="/login.html">Log in</a>
      <a class="nav-auth nav-auth-primary" id="signupNav" href="/signup.html">Sign up</a>
      <a class="nav-auth" id="customerNav" href="/dashboard.html" hidden>My bookings</a>
      <button class="nav-auth nav-auth-button" id="customerLogout" type="button" hidden>Log out</button>
    </nav>
  </header>
  <main class="account-main">
    <section class="account-card" aria-labelledby="pageTitle">
      <p class="eyebrow">ACCOUNT ACCESS</p>
      <h1 id="pageTitle">Reset your password</h1>
      <p id="resetIntro">Enter your account email and we’ll send a time-limited reset link if an account exists.</p>
      <form class="account-form" id="forgotPasswordForm">
        <label for="resetEmail">Email address</label>
        <input id="resetEmail" name="email" type="email" autocomplete="email"
          maxlength="254" required>
        <button class="button button-gold full-button" type="submit">Send reset link</button>
      </form>
      <form class="account-form" id="resetPasswordForm" hidden>
        <label for="newPassword">New password</label>
        <div class="password-field">
          <input id="newPassword" name="password" type="password"
            autocomplete="new-password" minlength="12" maxlength="256" required>
          <button class="password-toggle" type="button" data-password-toggle="newPassword"
            aria-label="Show password" aria-pressed="false">Show</button>
        </div>
        <label for="newPasswordConfirm">Confirm new password</label>
        <input id="newPasswordConfirm" name="confirmPassword" type="password"
          autocomplete="new-password" minlength="12" maxlength="256" required>
        <button class="button button-gold full-button" type="submit">Update password</button>
      </form>
      <p class="account-status" id="resetStatus" role="status" aria-live="polite"></p>
      <p class="account-switch"><a href="/login.html">Back to log in</a></p>
    </section>
  </main>
</body>
</html>
